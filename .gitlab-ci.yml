stages:\n  - version\n  - build\n  - test\n  - docs\n  - package\n\nworkflow:\n  rules:\n    - if: '$CI_PIPELINE_SOURCE == \"merge_request_event\"'\n    - if: '$CI_COMMIT_BRANCH'\n\nvariables:\n  GIT_STRATEGY: fetch\n  GIT_SUBMODULE_STRATEGY: recursive\n  DOTNET_NOLOGO: \"true\"\n  DOTNET_CLI_TELEMETRY_OPTOUT: \"true\"\n  BUILD_NUMBER: \"$CI_PIPELINE_IID\"\n  GIT_BRANCH: \"$CI_COMMIT_REF_NAME\"\n\nversion:\n  stage: version\n  image: mcr.microsoft.com/dotnet/sdk:8.0\n  script:\n    - dotnet tool restore\n    - echo \"VERSION_MAJOR=3\" > version.env\n    - echo \"VERSION_MINOR=8\" >> version.env\n    - echo \"VERSION_PATCH=1\" >> version.env\n    - echo \"VERSION_BUILD_COUNTER=${CI_PIPELINE_IID}\" >> version.env\n    - echo \"VERSION=${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}.${VERSION_BUILD_COUNTER}\" >> version.env\n  artifacts:\n    reports:\n      dotenv: version.env\n  rules:\n    - if: '$CI_COMMIT_BRANCH'\n\nbuild:mac:\n  stage: build\n  image: mcr.microsoft.com/dotnet/sdk:8.0\n  tags: [macos]\n  needs: [version]\n  script:\n    - dotnet tool restore\n    - dotnet cake build.cake\n  artifacts:\n    paths:\n      - Artifacts/**/iOS/**/*.nupkg\n      - Artifacts/**/Android/**/*.nupkg\n      - Artifacts/**/*.mpack\n  rules:\n    - if: '$CI_COMMIT_BRANCH'\n\nbuild:windows:\n  stage: build\n  image: mcr.microsoft.com/dotnet/sdk:8.0\n  tags: [windows]\n  needs: [version]\n  script:\n    - dotnet tool restore\n    - dotnet-cake build.cake\n  artifacts:\n    paths:\n      - Artifacts/**/*.nupkg\n      - Artifacts/**/*.vsix\n      - Artifacts/**/*.mpack\n  rules:\n    - if: '$CI_COMMIT_BRANCH'\n\ntest:mac:\n  stage: test\n  image: mcr.microsoft.com/dotnet/sdk:8.0\n  tags: [macos]\n  needs: [build:mac]\n  script:\n    - dotnet tool restore\n    - dotnet cake build.cake --build-target=Test\n  artifacts:\n    when: always\n    paths:\n      - Test/bin/Linux/AnyCPU/Debug/TestResult.xml\n  rules:\n    - if: '$CI_COMMIT_BRANCH'\n\ntest:windows:\n  stage: test\n  image: mcr.microsoft.com/dotnet/sdk:8.0\n  tags: [windows]\n  needs: [build:windows]\n  script:\n    - dotnet tool restore\n    - dotnet-cake build.cake -build-target=\"Test\"\n  artifacts:\n    when: always\n    paths:\n      - Test/bin/Windows/AnyCPU/Debug/CapturedFrames\n      - Test/bin/Windows/AnyCPU/Debug/Diffs\n      - Test/bin/Windows/AnyCPU/Debug/MonoGameTests.xml\n  rules:\n    - if: '$CI_COMMIT_BRANCH'\n\ndocs:\n  stage: docs\n  image: mcr.microsoft.com/dotnet/sdk:8.0\n  tags: [windows]\n  needs: [build:mac, build:windows]\n  script:\n    - docfx Documentation/docfx.json metadata\n    - docfx Documentation/docfx.json build\n  artifacts:\n    paths:\n      - Documentation/_site\n  rules:\n    - if: '$CI_COMMIT_BRANCH'\n\npackage:mac-and-linux:\n  stage: package\n  image: mcr.microsoft.com/dotnet/sdk:8.0\n  tags: [macos]\n  needs: [docs, test:windows, build:mac, build:windows]\n  script:\n    - nant -buildfile:default.build build_installer\n  artifacts:\n    paths:\n      - Installers/Pipeline.MacOS.pkg\n      - Installers/MonoGame.pkg\n      - Installers/Linux/monogame-sdk.deb\n      - Installers/Linux/monogame-sdk.run\n  rules:\n    - if: '$CI_COMMIT_BRANCH'\n  when: manual\n\npackage:windows:\n  stage: package\n  image: mcr.microsoft.com/dotnet/sdk:8.0\n  tags: [windows]\n  needs: [docs, test:windows, build:mac, build:windows]\n  script:\n    - nant -buildfile:default.build build_installer\n  artifacts:\n    paths:\n      - Installers/Windows/MonoGameSetup.exe\n  rules:\n    - if: '$CI_COMMIT_BRANCH'\n  when: manual\n